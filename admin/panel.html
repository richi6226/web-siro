<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Propiedades · Panel SIRO</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<meta name="theme-color" content="#131b2e">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="/js/tailwind-config.js"></script>
</head>
<body class="admin invisible min-h-screen">

<header class="bg-white border-b border-[#e5e2dd] sticky top-0 z-30">
  <div class="max-w-6xl mx-auto h-16 px-4 sm:px-6 flex items-center justify-between gap-4">
    <a href="/admin/panel" class="flex items-center gap-3">
      <img src="/img/logo.png" alt="SIRO" class="h-8 w-auto">
      <span class="hidden sm:inline text-xs uppercase tracking-[0.2em] font-semibold text-[#a17f3b]">Panel</span>
    </a>
    <div class="flex items-center gap-1 sm:gap-3">
      <a href="/" target="_blank" rel="noopener" class="btn btn-ghost !px-3 !py-2 text-[13px]">
        <span class="material-symbols-outlined !text-[18px]">open_in_new</span>
        <span class="hidden sm:inline">Ver la web</span>
      </a>
      <span class="hidden md:inline text-[13px] text-[#5f5e5b]" data-user-email></span>
      <button class="icon-btn" data-logout title="Cerrar sesión" aria-label="Cerrar sesión">
        <span class="material-symbols-outlined">logout</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 pb-24">
  <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
    <div>
      <h1 class="text-3xl sm:text-4xl text-[#0b1c30]" style="font-family:'Playfair Display',serif">Propiedades</h1>
      <p class="text-[15px] text-[#5f5e5b] mt-1" id="resumen">Cargando…</p>
    </div>
    <a href="/admin/editar" class="btn btn-primary">
      <span class="material-symbols-outlined">add</span>
      Nueva propiedad
    </a>
  </div>

  <div class="flex flex-col md:flex-row md:items-center gap-3 mb-6">
    <div class="flex gap-1 overflow-x-auto -mx-4 px-4 md:mx-0 md:px-0 pb-1" role="tablist" id="filtros"></div>
    <label class="relative md:ml-auto md:w-72">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#76777d] !text-[20px]">search</span>
      <input id="buscar" class="input !pl-10" type="search" placeholder="Buscar por título, referencia o zona" aria-label="Buscar propiedades">
    </label>
  </div>

  <div id="lista" class="flex flex-col gap-3" aria-live="polite">
    <div class="admin-card h-32 animate-pulse"></div>
    <div class="admin-card h-32 animate-pulse"></div>
    <div class="admin-card h-32 animate-pulse"></div>
  </div>
</main>

<template id="tpl-fila">
  <article class="admin-card p-3 sm:p-4 flex flex-col sm:flex-row gap-4 hover:border-[#cfcac2] transition-colors">
    <a data-editar class="block shrink-0 w-full sm:w-44 aspect-[4/3] rounded-lg overflow-hidden bg-[#efede9]">
      <img data-foto class="w-full h-full object-cover" alt="" loading="lazy">
      <div data-sin-foto class="hidden w-full h-full flex items-center justify-center text-[#a8a59f]">
        <span class="material-symbols-outlined !text-[40px]">photo_camera</span>
      </div>
    </a>
    <div class="flex-1 min-w-0 flex flex-col gap-1">
      <div class="flex items-center gap-2 flex-wrap">
        <span data-badge class="badge"></span>
        <span data-destacada class="hidden badge bg-[#fdf0d8] text-[#8a5a00]">
          <span class="material-symbols-outlined !text-[14px]" style="font-variation-settings:'FILL' 1">star</span>Destacada
        </span>
        <span data-ref class="text-xs font-mono text-[#76777d]"></span>
      </div>
      <a data-editar data-titulo class="text-lg font-semibold text-[#0b1c30] hover:underline underline-offset-4 truncate"></a>
      <p data-meta class="text-sm text-[#5f5e5b] truncate"></p>
      <p data-precio class="text-base font-semibold text-[#0b1c30]"></p>
      <p data-fecha class="text-xs text-[#76777d] mt-auto"></p>
    </div>
    <div class="flex sm:flex-col items-center sm:items-end justify-between gap-2 sm:w-44">
      <select data-estado class="input estado-select !py-2 !text-sm sm:w-full" aria-label="Cambiar estado"></select>
      <div class="flex gap-1">
        <a data-editar class="icon-btn" title="Editar" aria-label="Editar"><span class="material-symbols-outlined">edit</span></a>
        <a data-ver class="icon-btn" title="Ver en la web" aria-label="Ver en la web" target="_blank" rel="noopener"><span class="material-symbols-outlined">visibility</span></a>
        <button data-duplicar class="icon-btn" title="Duplicar" aria-label="Duplicar"><span class="material-symbols-outlined">content_copy</span></button>
        <button data-eliminar class="icon-btn hover:!text-[#ba1a1a]" title="Eliminar" aria-label="Eliminar"><span class="material-symbols-outlined">delete</span></button>
      </div>
    </div>
  </article>
</template>

<script type="module" src="/js/admin/panel.js"></script>
</body>
</html>

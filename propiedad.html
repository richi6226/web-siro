<!-- Visor de fotos a pantalla completa -->
<dialog id="visor" class="m-0 w-screen h-[100dvh] max-w-none max-h-none bg-[#0b1220] p-0 backdrop:bg-black/80" aria-label="Fotos de la propiedad">

    <div class="flex items-center justify-between px-4 h-14 text-white shrink-0">
      <span id="visor-contador" class="text-sm tabular-nums"></span>
      <button type="button" id="visor-cerrar" class="p-2 rounded-full hover:bg-white/10" aria-label="Cerrar">
        <span class="material-symbols-outlined text-[28px]">close</span>
      </button>
    </div>
    <div id="visor-pista" class="flex-1 flex overflow-x-auto snap-x snap-mandatory [scrollbar-width:none]"></div>
    <button type="button" id="visor-prev" class="hidden md:flex absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 text-white items-center justify-center" aria-label="Foto anterior">
      <span class="material-symbols-outlined">chevron_left</span>
    </button>
    <button type="button" id="visor-next" class="hidden md:flex absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 text-white items-center justify-center" aria-label="Foto siguiente">
      <span class="material-symbols-outlined">chevron_right</span>
    </button>

</dialog>
